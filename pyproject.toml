[project]
name = "discord-screen"
version = "0.2.0"
description = "Transmissão nativa de tela e áudio do sistema para o Discord Activity via WebCodecs e GTK4"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "websockets>=12.0",
    "jinja2>=3.1.3",
    "python-multipart>=0.0.9",
    "psutil>=5.9.8",
    "PyGObject>=3.48.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
