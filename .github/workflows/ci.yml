name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Windows está na matriz porque é onde este projeto é escrito, e porque o
    # que quebra só num sistema — caminho com barra invertida, CRLF, o spawn do
    # servidor pelos scripts — quebra lá.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      # Node 22 é o piso do projeto: o servidor usa fetch nativo, --watch e
      # fs.statfsSync, e nenhum dos três existe antes disso.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formatação
        run: npm run format:check

      # O site é o que a atividade carrega. Um PR que quebra o build do cliente
      # não pode ficar verde só porque o servidor continua de pé. Vem antes dos
      # testes porque parte deles fala com o servidor, que serve o que saiu daqui.
      - name: Build do site
        run: npm run build

      - name: Testes
        run: npm test

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Instalar
        run: npm ci
      - name: Build do site
        run: npm run build
      - name: Coverage
        run: npm run test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Construir a imagem
        run: docker build -t streamroom:ci .
